# Manifest of every file in data/raw/ (except data/raw/acs/, which 00_download_acs.py fetches from the Census API).
# Read by src/prep/download_raw.py: it downloads missing files from `url`, falls back to the GitHub Release asset
# below when the official download fails or serves different bytes, and verifies size and SHA-256 of every file.
#
#   access: scripted        official URL, downloadable by script
#           manual_blocked  official page exists but the publisher refuses scripted downloads (HTTP 403)
#           manual_export   hand-exported from a web tool, no stable URL
# retrieved / retrieved_how: see each file. For scripted files this is the date the official URL was re-downloaded and
# the SHA-256 matched the file used in the analysis. Original download dates were not recorded.
